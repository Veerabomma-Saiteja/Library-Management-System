<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Library Management System</h1>
    <p>Manage books easily</p>
</header>

<main>

    <section class="card">

        <h2>Add New Book</h2>

        <form id="bookForm">

            <input
                type="text"
                id="title"
                placeholder="Book Title"
                required
            >

            <input
                type="text"
                id="author"
                placeholder="Author"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <button type="submit">
                Add Book
            </button>

        </form>

        <p id="message"></p>

    </section>


    <section class="card">

        <div class="top-section">

            <h2>Book Records</h2>

            <input
                type="text"
                id="search"
                placeholder="Search books..."
            >

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="bookList"></tbody>

            </table>

        </div>

    </section>

</main>

<footer>
    <p>Library Management System © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
